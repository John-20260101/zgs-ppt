name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install python-pptx python-docx Pillow
      - name: Build example deck (Z5, 13 pages)
        run: |
          python scripts/build_pptx.py "examples/case-wang/王某某-outline.json" \
            -o /tmp/demo.pptx --report /tmp/demo-audit.md
          python scripts/check_deck.py /tmp/demo.pptx --expect 13
      - name: No text overflow in audit
        run: |
          test -f /tmp/demo-audit.md
          if grep -qE "紧度峰值：1[0-9][0-9]%" /tmp/demo-audit.md; then
            echo "::error::文字溢出，见审计报告"; cat /tmp/demo-audit.md; exit 1
          fi
          sed -n '/## 结构检查/,$p' /tmp/demo-audit.md
      - name: Outline contract check
        run: python scripts/build_pptx.py "examples/case-wang/王某某-outline.json" --audit-only --report /tmp/a.md
