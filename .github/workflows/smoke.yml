name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 1) 契约回归：17 页型字段、字数上限、模板包结构、一致性脚本、页数口径
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install python-pptx python-docx Pillow
      - name: Unittest
        run: python -m unittest discover -s tests -v

  # 2) 示例成稿：18 页 Z5，--strict 门禁 + 文件级 + 同源
  deck:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-pptx python-docx Pillow
      - name: Build example (strict gate)
        run: |
          python scripts/build_pptx.py examples/case-wang/王某某-outline.json \
            -o /tmp/demo.pptx --report /tmp/demo-audit.md --strict
      - name: File-level check
        run: python scripts/check_deck.py /tmp/demo.pptx --group Z5 --expect 18
      - name: No overflow / no empty page in audit
        run: |
          test -f /tmp/demo-audit.md
          ! grep -qE "紧度峰值：1[0-9][0-9]%" /tmp/demo-audit.md
          ! grep -q "page-empty-bottom" /tmp/demo-audit.md
          ! grep -q "page-count" /tmp/demo-audit.md
          ! grep -q -E "notes-(short|long)" /tmp/demo-audit.md
          ! grep -q "cap-" /tmp/demo-audit.md
          sed -n '/## 结构检查/,$p' /tmp/demo-audit.md
      - name: Outline / JSON same source
        run: |
          python scripts/check_outline.py examples/case-wang/王某某-outline.json \
            "examples/case-wang/王某某-求职综合展示-大纲.md"

  # 3) 模板路径 + 渲染复核：装 LibreOffice/poppler 真跑一遍
  render:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk
          pip install python-pptx python-docx Pillow
      - name: Build with school template (4:3)
        run: |
          python scripts/build_pptx.py examples/case-wang/王某某-outline.json \
            -o /tmp/tpl.pptx --template assets/school-template.pptx --pdf --strict
      - name: Template deck opens and has no duplicate parts
        run: |
          python - <<'PY'
          import collections, zipfile, sys
          from pptx import Presentation
          z = zipfile.ZipFile("/tmp/tpl.pptx")
          dups = [k for k, v in collections.Counter(i.filename for i in z.infolist()).items() if v > 1]
          print("duplicate parts:", dups)
          assert not dups, "zip 内出现重名 part，PowerPoint 会要求修复"
          prs = Presentation("/tmp/tpl.pptx")
          assert len(prs.slides) == 18, len(prs.slides)
          assert abs(prs.slide_width / 914400 - 10.0) < 0.02, "4:3 模板应等比缩放"
          print("template deck OK")
          PY
      - name: Render-level check (越界/压字/过小字号)
        run: python scripts/verify_pptx.py /tmp/tpl.pptx --expect-pages 18 --require
      - name: PDF exists
        run: test -s /tmp/tpl.pdf

  # 4) 插件层：manifest / frontmatter / list-get
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/smoke_plugin.mjs
